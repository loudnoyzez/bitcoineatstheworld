name: Update market data
# Refreshes data/markets.json (commodities, currencies, stock indexes priced in sats) every day.
on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC: after the US close (5:30 am Bangkok)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_data.py
      - name: Commit if changed
        run: |
          git config user.name "betw-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/markets.json
          git diff --cached --quiet || (git commit -m "Daily market data" && git push)
